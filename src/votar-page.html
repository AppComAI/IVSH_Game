<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Votação · A Régua das Águas</title>
<meta name="description" content="Votação anônima da turma sobre o jogo A Régua das Águas: entendi? o que melhorar?">
<meta name="robots" content="noindex">
<style>
/*__FONTS__*/
:root{--navy:#0A1B4D;--royal:#1B46C2;--ice:#EEF3FD;--line:#C9D7F3;--muted:#4A5E85;--ok:#1E7A46;--font-body:'Barlow',system-ui,sans-serif;--font-cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ice);color:var(--navy);font-family:var(--font-body);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.top .dot{width:34px;height:34px;border-radius:50%;background:var(--royal);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.k{font:700 13px var(--font-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--royal)}
h1{font:800 30px/1.05 var(--font-cond);margin:2px 0 6px}
h2{font:800 24px/1.12 var(--font-cond);margin:0 0 12px}
p{margin:0 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:0 6px 24px rgba(10,27,77,.08)}
.note{font-size:14px;color:var(--muted)}
.bar{height:8px;border-radius:6px;background:var(--line);margin:0 0 14px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--royal);transition:width .3s}
.opts{display:grid;gap:10px;margin:12px 0 4px}
button{font:600 17px var(--font-body);color:var(--navy);background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 14px;text-align:left;cursor:pointer;min-height:54px;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.99)}
button:focus-visible{outline:3px solid #FFC233;outline-offset:2px}
button.sel{border-color:var(--royal);background:#E4ECFD}
button.pri{background:var(--royal);border-color:var(--royal);color:#fff;text-align:center}
button.pri[disabled]{opacity:.45}
button.ghost{border-color:transparent;background:transparent;color:var(--royal);text-decoration:underline;text-align:center}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.faces button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;text-align:center;font-size:13.5px;line-height:1.15;min-height:0}
.faces button svg{width:52px;height:52px}
textarea{width:100%;min-height:96px;font:inherit;color:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.fb{border-left:5px solid var(--royal);background:#F6F9FF;border-radius:0 10px 10px 0;padding:8px 12px;margin:0 0 10px;font-size:15px}
.fb b{font-family:var(--font-cond);letter-spacing:.03em}
.warn{background:#FFF3CF;border:1px solid #E7C35A;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px;color:#4a3800}
.err{background:#FDE7E3;border:1px solid #E58E80;border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px;color:#5b1a10}
[hidden]{display:none!important}
.foot{margin-top:16px;font-size:13px;color:var(--muted)}
@media (prefers-color-scheme:dark){:root{--ice:#0A1B4D;--navy:#EEF3FD;--line:#2B4380;--muted:#B5C3E6}.card,button{background:#12286B}.fb{background:#12286B}button.sel{background:#1B3A8F}.warn{background:#4a3a0a;color:#ffe9a8;border-color:#8a6d16}.err{background:#4b1b14;color:#ffd6cf}textarea{background:#12286B}}
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="dot" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C8 8 5 11.5 5 15a7 7 0 0014 0c0-3.5-3-7-7-13z"/></svg></div><div><div class="k">A Régua das Águas</div><div class="k" id="rnome" style="color:var(--muted)"></div></div></div>
  <div id="warn" class="warn" hidden></div>
  <div class="card" id="tela" aria-live="polite"></div>
  <p class="foot">Votação anônima: não pedimos nome, e-mail nem telefone. As respostas servem só para melhorar o projeto. Jogo educativo; o IVSH é uma proposta, ainda não aplicada.</p>
</div>
<!--__APP__-->
</body>
</html>
